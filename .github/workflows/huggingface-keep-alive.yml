name: Huggingface Keep-Alive

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Huggingface Keep-Alive Ping
        run: |
          urls='${{ vars.HF_SPACE_URLS }}'
          echo "$urls" | jq -r '.[]' | while read url; do
            echo "Pinging: $url"
            curl -s -o /dev/null -w "%{http_code}" "$url" && echo " - OK" || echo " - Failed"
          done
